[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-release-collector"
version = "0.1.0"
description = "Configuration-driven official software release metadata collector"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
software-release-collector = "software_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
